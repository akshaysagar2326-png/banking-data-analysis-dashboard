<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FinBank Login</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-page">

    <!-- LEFT SIDE -->

    <div class="login-left">

        <div class="overlay"></div>

        <div class="banking-content">

            <h1>

                Smart Banking <br>
                Data Analysis Dashboard

            </h1>

            <p>

                Securely manage banking insights,
                customer analytics, loans, deposits,
                and real-time financial intelligence.

            </p>

        </div>

    </div>

    <!-- RIGHT SIDE -->

    <div class="login-right">

        <div class="login-box">

            <h2>
                Welcome Back
            </h2>

            <p class="subtext">

                Login to your FinBank account

            </p>

            <form id="loginForm">

                <div class="input-group">

                    <label>
                        Username
                    </label>

                    <input type="text"
                        name="username"
                        placeholder="Enter username"
                        required>

                </div>

                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <input type="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                </div>

                <button class="btn login-btn">

                    Login

                </button>

            </form>

            <div class="auth-links">

                <a href="/forgot-password">

                    Forgot Password?

                </a>

                <a href="/register">

                    Create Account

                </a>

            </div>

        </div>

    </div>

</div>

<script>

document.getElementById('loginForm')
.addEventListener('submit', async(e)=>{

    e.preventDefault();

    const formData =
        new FormData(e.target);

    const response = await fetch('/login', {

        method:'POST',

        body:formData

    });

    const data =
        await response.json();

    if(data.status==='success'){

        window.location='/dashboard';

    }else{

        alert(data.message);

    }

});

</script>

</body>

</html>
